# Project-wide Gradle settings.
# Kept in the Android package source dir so Qt does NOT regenerate it from its
# hardcoded template (-Xmx3200m): that value fails to commit on Windows boxes
# with a small page file ("os::commit_memory failed / 页面文件太小"), killing the
# Gradle daemon before it even starts. 1280m is plenty for this project's APK.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable building projects in parallel
org.gradle.parallel=true

# Allow AndroidX usage
android.useAndroidX=true
